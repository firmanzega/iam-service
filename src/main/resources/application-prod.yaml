# application-prod.yaml
logging:
  level:
    id.osprey.iamservice: INFO
    org.hibernate.SQL: INFO

server:
  port: 9090

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      # Skema divalidasi terhadap hasil migrasi Flyway. Tidak pernah auto-create
      # di produksi, karena itu bisa menghasilkan skema yang berbeda dari migrasi.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true

springdoc:
  # Dokumentasi API dimatikan di produksi. Deskripsi endpoint adalah peta jalan
  # bagi penyerang, jadi tidak perlu terekspos ke internet.
  #
  # Di profil pengembangan, dokumentasi tetap hidup. Buka
  # http://localhost:8080/swagger-ui.html
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
