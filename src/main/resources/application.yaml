spring:
  application:
    name: iam-service
  config:
    # Import file .env sebagai properties agar aplikasi dan test bisa jalan tanpa
    # export manual variabel environment. "optional:" berarti file boleh tidak ada
    # (misalnya di produksi, di mana kredensial disuplai lewat environment variable).
    # Environment variable asli tetap menang atas isi .env karena prioritasnya lebih tinggi.
    import: optional:file:.env[.properties]
  flyway:
    # Sumber kebenaran skema. Hanya lokasi ini yang berlaku di semua profil.
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 50
        # Bentuk JSON Page harus tetap { "content": [...], "page": {...} }.
        # Ditetapkan lewat properti, BUKAN @EnableSpringDataWebSupport, karena
        # anotasi tersebut mendaftarkan resolver pagination sendiri sehingga
        # max-page-size di atas ikut diabaikan.
        serialization-mode: via_dto
  profiles:
    active: dev

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        # Hanya health dan metrics yang dibuka. Endpoint lain yang punya
        # actuator bisa membocorkan detail internal layanan.
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

iam:
  jwt:
    # Kunci penanda tangan token. Wajib diganti di produksi.
    # Panjang minimal 32 byte.
    secret: ${JWT_SECRET}
    issuer: iam-service
    # Masa berlaku token akses sengaja pendek, karena token akses dipakai pada
    # setiap permintaan dan token yang berumur panjang memperbesar jendela
    # pencurian token.
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cors:
    # Daftar origin frontend yang diizinkan. Tanda bintang tidak boleh dipakai
    # karena permintaan dari origin mana pun akan diterima.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  login:
    # Jumlah kegagalan login sebelum akun dikunci.
    max-failed-attempts: 5
    lock-duration: 15m
  rate-limit:
    # Batas permintaan per jendela waktu untuk satu alamat IP, khusus pada
    # endpoint autentikasi. Tujuannya menahan percobaan login bertubi-tubi.
    max-requests: 20
    window: 1m
    # Selang pemindaian entri klien yang sudah tidak aktif. Tanpa pemindaian,
    # satu entri per alamat IP menetap di memori selamanya.
    cleanup-interval: 10m
  refresh-token-cleanup:
    # Token yang sudah kedaluwarsa tidak bisa dipakai lagi, tetapi barisnya
    # tetap ada. Pembersihan berkala mencegah tabel refresh_tokens tumbuh
    # tanpa batas.
    enabled: true
    interval: 1h
