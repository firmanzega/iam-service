server:
  # Saat berjalan di belakang reverse proxy, alamat klien diambil dari header
  # X-Forwarded-For hanya kalau koneksi datang dari jaringan internal. Tanpa
  # pengaturan ini, rate limiter akan menghitung alamat proxy untuk semua
  # pengguna sehingga seluruh trafik berbagi satu kuota.
  # Pastikan layanan tidak bisa dijangkau langsung dari jaringan publik.
  forward-headers-strategy: native

logging:
  pattern:
    # traceId dan spanId kosong saat sampling dimatikan, sehingga bentuk log
    # biasa tidak berubah. Saat tracing dinyalakan, kedua nilai itu yang
    # menghubungkan satu baris log dengan rentangannya di collector.
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

spring:
  application:
    name: iam-service
  config:
    # Import file .env sebagai properties agar aplikasi dan test bisa jalan tanpa
    # export manual variabel environment. "optional:" berarti file boleh tidak ada
    # (misalnya di produksi, di mana kredensial disuplai lewat environment variable).
    # Environment variable asli tetap menang atas isi .env karena prioritasnya lebih tinggi.
    import: optional:file:.env[.properties]
  flyway:
    # Sumber kebenaran skema. Hanya lokasi ini yang berlaku di semua profil.
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 50
        # Bentuk JSON Page harus tetap { "content": [...], "page": {...} }.
        # Ditetapkan lewat properti, BUKAN @EnableSpringDataWebSupport, karena
        # anotasi tersebut mendaftarkan resolver pagination sendiri sehingga
        # max-page-size di atas ikut diabaikan.
        serialization-mode: via_dto
  task:
    scheduling:
      pool:
        # Setiap tugas latar punya jadwal sendiri: pemindaian rate limiter,
        # pembersihan token refresh, pembersihan sesi, dan pembersihan agregat
        # penolakan. Ukuran pool disamakan dengan jumlah tugas itu supaya satu
        # pembersihan yang lambat tidak menunda jadwal lainnya.
        size: 4
  profiles:
    active: dev

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        # Hanya health dan metrics yang dibuka. Endpoint lain yang punya
        # actuator bisa membocorkan detail internal layanan.
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true
  tracing:
    sampling:
      # Sampling dimatikan secara bawaan. Tanpa collector yang menerima
      # kiriman, menyalakan sampling hanya menghasilkan percobaan ekspor yang
      # gagal berulang. Nyalakan lewat environment variable saat collector
      # benar-benar tersedia.
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:0.0}
  otlp:
    tracing:
      # Collector OTLP/HTTP. Nilai bawaan Spring Boot sudah alamat lokal, tetapi
      # ditulis eksplisit supaya operator tahu harus mengarahkan ke mana.
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

iam:
  jwt:
    # Kunci penanda tangan token. Wajib diganti di produksi.
    # Panjang minimal 32 byte.
    secret: ${JWT_SECRET}
    # Kunci sebelumnya yang masih diterima selama rotasi. Biarkan kosong pada
    # operasi normal. Isi dengan kunci lama saat mengganti kunci aktif, lalu
    # kosongkan lagi setelah masa berlaku token lama habis.
    previous-secret: ${JWT_SECRET_PREVIOUS:}
    issuer: iam-service
    # Masa berlaku token akses sengaja pendek, karena token akses dipakai pada
    # setiap permintaan dan token yang berumur panjang memperbesar jendela
    # pencurian token.
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cors:
    # Daftar origin frontend yang diizinkan. Tanda bintang tidak boleh dipakai
    # karena permintaan dari origin mana pun akan diterima.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  login:
    # Jumlah kegagalan login sebelum akun dikunci.
    max-failed-attempts: 5
    lock-duration: 15m
  rate-limit:
    # Batas permintaan per jendela waktu untuk satu alamat IP, khusus pada
    # endpoint autentikasi. Tujuannya menahan percobaan login bertubi-tubi.
    max-requests: 20
    window: 1m
    # Selang pemindaian entri klien yang sudah tidak aktif. Tanpa pemindaian,
    # satu entri per alamat IP menetap di memori selamanya.
    cleanup-interval: 10m
  refresh-token-cleanup:
    # Token yang sudah kedaluwarsa tidak bisa dipakai lagi, tetapi barisnya
    # tetap ada. Pembersihan berkala mencegah tabel refresh_tokens tumbuh
    # tanpa batas.
    enabled: true
    interval: 1h
  session-cleanup:
    # Sesi yang tidak dipakai lebih lama dari masa berlaku token refresh tidak
    # bisa dilanjutkan lagi. Barisnya dihapus supaya daftar perangkat tidak
    # menyimpan riwayat selamanya.
    enabled: true
    interval: 1h
  security-rejection-stats:
    # Agregat 401 dipakai untuk melihat lonjakan penolakan tanpa menyimpan
    # setiap permintaan. Retensinya pendek karena nilainya menurun dengan
    # cepat setelah kejadian.
    enabled: true
    retention: 30d
    interval: 1h
