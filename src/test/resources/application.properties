# Penjadwal pembersihan token dimatikan selama pengujian supaya tes tidak
# menghapus data di database pengembangan di luar kendali tes. Perilaku
# pembersihan tetap diuji langsung lewat RefreshTokenCleanupServiceTest dan
# RefreshTokenCleanupIntegrationTest.
iam.refresh-token-cleanup.enabled=false

# Kunci khusus pengujian. Nilainya bukan rahasia dan tidak dipakai di
# lingkungan lain. Dengan nilai ini, rangkaian tes tidak bergantung pada berkas
# .env lokal, sehingga build di mesin bersih dan di CI berjalan sama.
iam.jwt.secret=kunci-rahasia-untuk-pengujian-otomatis-minimal-32-byte
