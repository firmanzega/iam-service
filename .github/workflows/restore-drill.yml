name: Restore drill

# A backup is only a backup once it has been restored. This workflow takes a
# real dump with scripts/backup-postgres.sh, destroys the data, restores it, and
# asserts that rows, uniqueness, and indexes survived the round trip.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The nightly schedule proves the scripts keep working even when the
  # repository has not changed.
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  round-trip:
    name: Backup and restore round trip
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: iam_db
          POSTGRES_USER: iam_user
          POSTGRES_PASSWORD: restore-drill-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam_user -d iam_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_DB: iam_db
      POSTGRES_USER: iam_user
      POSTGRES_PASSWORD: restore-drill-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      PGPASSWORD: restore-drill-password

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Make the scripts executable
        run: chmod +x scripts/backup-postgres.sh scripts/restore-postgres.sh

      - name: Seed data worth restoring
        run: |
          psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 <<'SQL'
          create table restore_probe (
              id bigint generated by default as identity primary key,
              label text not null unique,
              created_at timestamptz not null default now()
          );
          create index restore_probe_created_at_idx on restore_probe (created_at);
          insert into restore_probe (label) values ('one'), ('two'), ('three');
          SQL

      - name: Create the backup
        run: scripts/backup-postgres.sh "$RUNNER_TEMP/iam-restore.dump"

      - name: Destroy the seeded data
        run: |
          psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c 'drop table restore_probe;'

      - name: Restore the backup
        run: scripts/restore-postgres.sh "$RUNNER_TEMP/iam-restore.dump" --yes

      - name: Assert rows, values, and indexes came back
        run: |
          PSQL=(psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1)

          rows=$("${PSQL[@]}" -tAc "select count(*) from restore_probe;")
          test "$rows" = "3"

          labels=$("${PSQL[@]}" -tAc "select string_agg(label, ',' order by label) from restore_probe;")
          test "$labels" = "one,two,three"

          index_count=$("${PSQL[@]}" -tAc \
            "select count(*) from pg_indexes where indexname = 'restore_probe_created_at_idx';")
          test "$index_count" = "1"

          unique_count=$("${PSQL[@]}" -tAc \
            "select count(*) from pg_constraint c join pg_class t on t.oid = c.conrelid
              where t.relname = 'restore_probe' and c.contype = 'u';")
          test "$unique_count" = "1"
