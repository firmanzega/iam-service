name: Restore drill

# A backup is only a backup once it has been restored. This workflow takes a
# real dump with scripts/backup-postgres.sh, destroys the data, restores it, and
# asserts that rows, uniqueness, and indexes survived the round trip.
#
# The drill is fully self-contained: it starts its own disposable PostgreSQL
# container and talks to it via `docker exec`. No psql/pg_dump/pg_restore is
# required on the runner (vanilla ubuntu:24.04 ships none of them).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The nightly schedule proves the scripts keep working even when the
  # repository has not changed.
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  round-trip:
    name: Backup and restore round trip
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Make the scripts executable
        run: chmod +x scripts/backup-postgres.sh scripts/restore-postgres.sh

      - name: Start a disposable PostgreSQL 16
        run: |
          docker run -d --name restore-drill-db \
            -e POSTGRES_DB=iam_db \
            -e POSTGRES_USER=iam_user \
            -e POSTGRES_PASSWORD=restore-drill-password \
            postgres:16

      - name: Wait for PostgreSQL to accept connections
        run: |
          for attempt in $(seq 1 30); do
            if docker exec restore-drill-db pg_isready -U iam_user -d iam_db; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          docker logs restore-drill-db
          exit 1

      - name: Seed data worth restoring
        run: |
          docker exec -i -e PGPASSWORD=restore-drill-password restore-drill-db \
            psql -U iam_user -d iam_db -v ON_ERROR_STOP=1 <<'SQL'
          create table restore_probe (
              id bigint generated by default as identity primary key,
              label text not null unique,
              created_at timestamptz not null default now()
          );
          create index restore_probe_created_at_idx on restore_probe (created_at);
          insert into restore_probe (label) values ('one'), ('two'), ('three');
          SQL

      - name: Create the backup
        run: |
          BACKUP_DOCKER_CONTAINER=restore-drill-db \
          POSTGRES_DB=iam_db POSTGRES_USER=iam_user POSTGRES_PASSWORD=restore-drill-password \
            scripts/backup-postgres.sh "$RUNNER_TEMP/iam-restore.dump"

      - name: Destroy the seeded data
        run: |
          docker exec -e PGPASSWORD=restore-drill-password restore-drill-db \
            psql -U iam_user -d iam_db -v ON_ERROR_STOP=1 -c 'drop table restore_probe;'

      - name: Restore the backup
        run: |
          BACKUP_DOCKER_CONTAINER=restore-drill-db \
          POSTGRES_DB=iam_db POSTGRES_USER=iam_user POSTGRES_PASSWORD=restore-drill-password \
            scripts/restore-postgres.sh "$RUNNER_TEMP/iam-restore.dump" --yes

      - name: Assert rows, values, and indexes came back
        run: |
          run_sql() {
            docker exec -e PGPASSWORD=restore-drill-password restore-drill-db \
              psql -U iam_user -d iam_db -tA -c "$1"
          }

          rows=$(run_sql "select count(*) from restore_probe;")
          test "$rows" = "3"

          labels=$(run_sql "select string_agg(label, ',' order by label) from restore_probe;")
          test "$labels" = "one,three,two"

          index_count=$(run_sql \
            "select count(*) from pg_indexes where indexname = 'restore_probe_created_at_idx';")
          test "$index_count" = "1"

          unique_count=$(run_sql \
            "select count(*) from pg_constraint c join pg_class t on t.oid = c.conrelid
               where t.relname = 'restore_probe' and c.contype = 'u';")
          test "$unique_count" = "1"
