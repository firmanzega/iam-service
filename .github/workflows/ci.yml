name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Pemindaian mingguan tetap berjalan meskipun tidak ada perubahan kode.
  # Kerentanan baru pada dependensi lama tetap harus ditemukan.
  schedule:
    - cron: '0 3 * * 1'

# Jalankan ulang build yang gagal saat ada push baru.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build dan uji
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Berikan hak jalankan pada Maven Wrapper
        run: chmod +x mvnw

      - name: Jalankan pengujian dan pemeriksaan cakupan
        # Perintah verify menjalankan pengujian, membuat laporan JaCoCo,
        # memeriksa cakupan baris minimal 80 persen, serta menjalankan
        # Checkstyle dan SpotBugs. Build gagal kalau salah satu gagal.
        #
        # Database pengujian disediakan Testcontainers, jadi tidak perlu
        # layanan PostgreSQL terpisah di workflow ini.
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Bangun image Docker
        # Membuktikan Dockerfile masih bisa membangun image dari nol, bukan
        # hanya tersimpan di repositori tanpa pernah dijalankan.
        run: docker build --tag iam-service:ci .

      - name: Pindai kerentanan image
        # Hanya temuan HIGH dan CRITICAL yang memblokir build, dan hanya
        # kalau perbaikannya sudah tersedia. Temuan tanpa perbaikan tetap
        # dilaporkan tetapi tidak membuat pipeline merah tanpa jalan keluar.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: iam-service:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Unggah SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: target/bom.json
          retention-days: 30

      - name: Unggah laporan cakupan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: laporan-cakupan
          path: target/site/jacoco/
          retention-days: 14

      - name: Unggah laporan pengujian
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: laporan-pengujian
          path: target/surefire-reports/
          retention-days: 14

      - name: Simpan berkas jar
        uses: actions/upload-artifact@v7
        with:
          name: iam-service-jar
          path: target/*.jar
          retention-days: 30
