name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Jalankan ulang build yang gagal saat ada push baru.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build dan uji
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: iam_db
          POSTGRES_USER: iam_user
          POSTGRES_PASSWORD: iam_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam_user -d iam_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Siapkan berkas .env untuk pengujian
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=iam_db
          POSTGRES_USER=iam_user
          POSTGRES_PASSWORD=iam_password
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          JWT_SECRET=kunci-rahasia-untuk-pengujian-di-ci-1234567890
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          EOF

      - name: Berikan hak jalankan pada Maven Wrapper
        run: chmod +x mvnw

      - name: Jalankan pengujian dan pemeriksaan cakupan
        # Perintah verify menjalankan pengujian, membuat laporan JaCoCo, lalu
        # memeriksa apakah cakupan baris mencapai ambang 80 persen. Build
        # gagal kalau ambang itu tidak tercapai.
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Unggah laporan cakupan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-cakupan
          path: target/site/jacoco/
          retention-days: 14

      - name: Unggah laporan pengujian
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-pengujian
          path: target/surefire-reports/
          retention-days: 14

      - name: Simpan berkas jar
        uses: actions/upload-artifact@v4
        with:
          name: iam-service-jar
          path: target/*.jar
          retention-days: 30
