name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Jalankan ulangbuild yang gagal saat ada push baru.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build dan uji
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: iam_db
          POSTGRES_USER: iam_user
          POSTGRES_PASSWORD: iam_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam_user -d iam_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Siapkan Node untuk pemeriksaan bahasa
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Periksa kualitas Bahasa Indonesia pada dokumentasi
        # Memakai pemeriksa yang sama dengan mesin lokal, supaya hasil di
        # sini sama dengan hasil sebelum commit. Mode bawaan tidak butuh
        # pustaka tambahan, jadi tidak ada pemasangan yang diperlukan.
        run: node tools/check-bahasa.mjs README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md docs/libraries.md docs/peta-kode.md docs/security.md docs/runbook.md docs/manual-testing.md docs/deployment.md

      - name: Siapkan berkas .env untuk pengujian
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=iam_db
          POSTGRES_USER=iam_user
          POSTGRES_PASSWORD=iam_password
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          JWT_SECRET=kunci-rahasia-untuk-pengujian-di-ci-1234567890
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          EOF

      - name: Berikan hak jalankan pada Maven Wrapper
        run: chmod +x mvnw

      - name: Jalankan pengujian dan pemeriksaan cakupan
        # Perintah verify menjalankan pengujian, membuat laporan JaCoCo, lalu
        # memeriksa apakah cakupan baris mencapai ambang 80 persen. Build
        # gagal kalau ambang itu tidak tercapai.
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Ungah laporan cakupan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-cakupan
          path: target/site/jacoco/
          retention-days: 14

      - name: Ungah laporan pengujian
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-pengujian
          path: target/surefire-reports/
          retention-days: 14

      - name: Simpan berkas jar
        uses: actions/upload-artifact@v4
        with:
          name: iam-service-jar
          path: target/*.jar
          retention-days: 30
